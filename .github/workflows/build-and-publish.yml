name: Build APK and publish PWA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: afcsc-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract app project
        run: unzip -q AFCSC_Psychology_Quiz_App_Advanced_300Q-1.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AFCSC-Psychology-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/www

  deploy-pwa:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy PWA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
